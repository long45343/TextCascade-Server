name: CI

on:
  push:
    branches: [csharp]
  pull_request:
    branches: [csharp]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore TextCascade.Server.slnx

      - name: Build
        run: dotnet build TextCascade.Server.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test TextCascade.Server.slnx --configuration Release --no-build
          --filter "Category!=NetworkIntegration"
          --logger trx --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

  network-tests:
    name: Network integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore TextCascade.Server.slnx

      - name: Build
        run: dotnet build TextCascade.Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TextCascade.Server.slnx --configuration Release --no-build --filter "Category=NetworkIntegration"
