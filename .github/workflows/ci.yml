name: CI

on:
  push:
    branches: [main, go]
  pull_request:
    branches: [main, go]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt check
        run: |
          test -z "$(gofmt -l . )" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o TextCascade.Server ./cmd/server

      - name: Contract samples sha256
        run: |
          find testdata/contract-samples -type f | sort | xargs sha256sum > contract-samples.sha256
          sha256sum -c contract-samples.sha256

      - name: Test (unit + contract, race)
        run: go test ./... -race -timeout 600s -v

  network-tests:
    name: Network integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Test (network integration, race)
        run: go test ./internal/hosting/ -race -timeout 600s -v
