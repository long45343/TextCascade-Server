name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt / vet / build
        run: |
          test -z "$(gofmt -l . )" || (gofmt -l . && exit 1)
          go vet ./...
          go build -trimpath -o TextCascade.Server ./cmd/server

      - name: Test (unit + contract)
        run: go test ./... -timeout 600s

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows single binary
        run: >
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}"
          -o artifacts/win-x64/TextCascade.Server.exe ./cmd/server

      - name: Build Linux single binary
        run: >
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}"
          -o artifacts/linux-x64/TextCascade.Server ./cmd/server

      - name: Stage release files
        run: |
          mkdir -p release/textcascade-server-windows-x64 release/textcascade-server-linux-x64
          cp artifacts/win-x64/TextCascade.Server.exe release/textcascade-server-windows-x64/
          cp artifacts/linux-x64/TextCascade.Server release/textcascade-server-linux-x64/
          cp deploy/textcascade.toml release/textcascade-server-windows-x64/
          cp deploy/textcascade.toml release/textcascade-server-linux-x64/
          cp deploy/textcascade-server.service release/textcascade-server-linux-x64/
          cp install.sh release/textcascade-server-linux-x64/
          chmod +x release/textcascade-server-linux-x64/TextCascade.Server
          file release/textcascade-server-linux-x64/TextCascade.Server
          test -f release/textcascade-server-windows-x64/TextCascade.Server.exe
          test -f release/textcascade-server-linux-x64/TextCascade.Server
          test -f release/textcascade-server-linux-x64/install.sh

      - name: Package Windows archive
        run: |
          cd release
          zip -r ../TextCascade.Server-${{ steps.version.outputs.version }}-windows-x64.zip textcascade-server-windows-x64

      - name: Package Linux archive
        run: |
          cd release
          tar -czf ../TextCascade.Server-${{ steps.version.outputs.version }}-linux-x64.tar.gz textcascade-server-linux-x64

      - name: Generate checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum \
            TextCascade.Server-${{ steps.version.outputs.version }}-windows-x64.zip \
            TextCascade.Server-${{ steps.version.outputs.version }}-linux-x64.tar.gz \
            > checksums-sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: textcascade-server-${{ steps.version.outputs.version }}
          path: |
            TextCascade.Server-${{ steps.version.outputs.version }}-windows-x64.zip
            TextCascade.Server-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            checksums-sha256.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TextCascade Server ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            TextCascade.Server-${{ steps.version.outputs.version }}-windows-x64.zip
            TextCascade.Server-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            checksums-sha256.txt
            install.sh

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # 只用于运行阶段的镜像拉取与层拷贝；编译通过 $BUILDPLATFORM 原生交叉编译完成。
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # OCI 镜像名必须全小写，而仓库名是 TextCascade-Server。
          images: ghcr.io/long45343/textcascade-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
